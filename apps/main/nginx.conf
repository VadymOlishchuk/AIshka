server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;


  # Заголовки безпеки. HSTS вмикається там, де термінується TLS (за цим nginx
  # стоїть щось із сертифікатом) — тут він був би брехнею на http.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # style 'unsafe-inline' — заради style={{ width }} у React; script — лише свій.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API живе в сусідньому контейнері. X-Forwarded-For потрібен rate limit-у.
  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Зібрані файли мають хеш у назві — кешувати можна назавжди.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA: будь-який інший шлях — це index.html, маршрут розбере react-router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
