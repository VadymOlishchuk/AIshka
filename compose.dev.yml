# Дев: docker compose -f compose.yml -f compose.dev.yml up
# Джерела прокинуті з хоста, node_modules живуть у томі (нативні бінарники
# для Linux, а не для macOS). Vite з hot reload: main на :5173, landing на :5174;
# backend на :3001 через tsx watch. Один сервіс deps ставить залежності, решта
# чекають на нього — інакше кілька pnpm install навперейми ламають один одному store.
x-node: &node
  image: node:24-alpine
  working_dir: /app
  volumes:
    - .:/app
    - aishka-node-modules:/app/node_modules

services:
  deps:
    <<: *node
    command: sh -c "corepack enable && pnpm install --frozen-lockfile"
    environment:
      DATABASE_URL: postgresql://aishka:aishka@db:5432/aishka?schema=public
    restart: "no"

  migrate:
    <<: *node
    build: !reset null
    command: sh -c "corepack enable && pnpm db:deploy && pnpm content:sync"
    depends_on:
      deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    <<: *node
    build: !reset null
    command: sh -c "corepack enable && pnpm nx serve backend"
    environment:
      NODE_ENV: development
      CONTENT_DIR: /app/content
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  main:
    <<: *node
    build: !reset null
    command: sh -c "corepack enable && pnpm nx serve main"
    environment:
      API_PROXY_TARGET: http://backend:3001
      VITE_LANDING_URL: http://localhost:5174
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  landing:
    <<: *node
    build: !reset null
    command: sh -c "corepack enable && pnpm nx serve landing"
    environment:
      API_PROXY_TARGET: http://backend:3001
      VITE_MAIN_URL: http://localhost:5173
      CHOKIDAR_USEPOLLING: "1"
    ports:
      - "5174:5174"
    depends_on:
      deps:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

volumes:
  aishka-node-modules:
